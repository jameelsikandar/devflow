name: Isolated verification

on:
  pull_request:
  push:
    branches:
      - main
      - 'feat/**'
      - 'fix/**'
      - 'chore/**'
      - 'refactor/**'
      - 'test/**'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Types, tests and production build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: devflow_ci
          POSTGRES_PASSWORD: ci_fixture_only
          POSTGRES_DB: devflow_test
        ports:
          - '127.0.0.1:5432:5432'
        options: >-
          --health-cmd "pg_isready -U devflow_ci -d devflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      # These are public throwaway service credentials. Never substitute secrets.
      DATABASE_URL: postgresql://devflow_ci:ci_fixture_only@127.0.0.1:1/devflow_ci_unused?schema=public
      TEST_DATABASE_URL: postgresql://devflow_ci:ci_fixture_only@127.0.0.1:5432/devflow_test?schema=public
      APP_URL: http://localhost:3000
      AI_API_KEY: ''
      AI_BASE_URL: http://127.0.0.1:1/v1
      GITHUB_CLIENT_ID: ''
      GITHUB_CLIENT_SECRET: ''
      GITHUB_DEMO: 'false'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@1af3b93b6815bc44a9784bd300feb67ff0d1eeb3 # v6.0.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false

      - name: Set up lockfile-compatible pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: '11.9.0'
          run_install: false

      - name: Locate dependency store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache downloaded dependencies only
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node22-pnpm11-${{ hashFiles('pnpm-lock.yaml', 'pnpm-workspace.yaml') }}

      - name: Install exact locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate schema and generate Prisma Client
        run: |
          pnpm exec prisma validate
          pnpm db:generate

      - name: Guard target and apply migrations to ephemeral devflow_test only
        run: node --import tsx scripts/ci-verification.ts migrate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check core TypeScript
        run: pnpm typecheck:core

      - name: Compile worker without starting it
        run: pnpm github:worker:build

      - name: Run unit, HTTP and DOM regressions with mocked providers
        run: pnpm exec vitest run --pool=forks

      - name: Run PostgreSQL integration regressions on ephemeral devflow_test
        run: node --import tsx scripts/ci-verification.ts integration

      - name: Build production application with webpack
        run: pnpm build:webpack

      # Build generates Next.js route types before the full type check.
      - name: Check full TypeScript including generated route types
        run: pnpm typecheck
